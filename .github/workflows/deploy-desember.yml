name: Deploy Eir og Camillas desember

on:
  push:
    branches: [main]
    paths:
      - "desember/**"
      - ".github/workflows/deploy-desember.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-desember"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload desember app
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./desember"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
